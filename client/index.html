<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>login</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div id="loader"
    style="position:fixed;inset:0;background:#f0f0f0;display:flex;align-items:center;justify-content:center;z-index:10;">
    Loading...
  </div>
  <iframe id="background" src="https://sandamini034.github.io/three_js/#/ASG-02"
    onload="document.getElementById('loader').style.display='none'"></iframe>
  <form id="login-form">
    <h1 class="title">Login</h1>
    <input type="text" name="username" placeholder="Username">
    <input type="password" name="password" placeholder="Password">
    <button type="submit">Login</button>
    <a href="#" id="show-signup">Sign up</a>
    <p></p>
  </form>

  <form id="signup-form" style="display: none;">
    <h1 class="title">Sign Up</h1>
    <input type="text" name="username" placeholder="Username">
    <input type="email" name="email" placeholder="email">
    <input type="password" name="password" placeholder="Password">
    <button type="submit">Sign Up</button>
    <a href="#" id="show-login">Login</a>
    <p></p>
  </form>
  <script src="login.js"></script>
</body>

</html>
